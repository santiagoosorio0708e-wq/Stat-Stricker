spring.application.name=statstriker-gateway
server.port=${SERVER_PORT:8011}

# Hilos virtuales Java 21 para manejar múltiples consultas sin bloquear pools
spring.threads.virtual.enabled=true

# Límite amplio para adjuntos de fotos de apuestas en base64
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Frontend estático (mismas rutas que antes, cero cambios en UI)
spring.web.resources.static-locations=${FRONTEND_DIR:file:../frontend/}
spring.web.resources.cache.period=0

# Conexión interna al motor Python RAG / LLM / ESPN (sin secretos en código)
statstriker.ai-engine-url=${AI_ENGINE_URL:http://127.0.0.1:8012}
statstriker.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
statstriker.read-timeout-ms=${AI_READ_TIMEOUT_MS:65000}
statstriker.warmer-enabled=${CACHE_WARMER_ENABLED:true}
statstriker.chat-cache-ttl-seconds=${CHAT_CACHE_TTL_SECONDS:180}
statstriker.session-context-ttl-minutes=${SESSION_CONTEXT_TTL_MINUTES:30}

# Actuator para healthchecks de Docker
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
